name: Daily refresh
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  models: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python refresh.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "refresh-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stories.json pending.json seen.json
          git diff --staged --quiet || (git commit -m "Daily refresh" && git push)
